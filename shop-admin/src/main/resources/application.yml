server:
  port: 8105

# application.name/profiles 已迁 bootstrap.yml；mybatis-plus/autoconfigure.exclude/jackson 已上移 Nacos shop-common.yml（group SHOP）
# （原 redis 块已删——pom 无 data-redis 依赖，属 P10 删依赖后的死配置）
spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:8.130.22.3:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  # datasource 不上 Nacos（本地 application-local.yml 用它覆盖连旧库 shopmanagement）
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
