server:
  port: 8102

# application.name/profiles 已迁 bootstrap.yml；mybatis-plus/redis/autoconfigure.exclude/jackson/rabbitmq 连接基座已上移 Nacos shop-common.yml（group SHOP）
spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:8.130.22.3:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  # datasource 不上 Nacos（本地 application-local.yml 用它覆盖连旧库 shopmanagement）
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  elasticsearch:
    uris: ${ES_URI:http://8.130.22.3:9200}

# ES 搜索（P3）：未装 ES 时置 false 走 MySQL LIKE 降级
shop:
  search:
    es-enabled: ${ES_ENABLED:false}
