# Bootstrap 上下文配置（spring-cloud-starter-bootstrap 启用，先于主上下文加载）
# name/profiles 必须在此层声明：Nacos dataId 自动探测与 profile 贯穿两层上下文都依赖它
spring:
  application:
    name: shop-product
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:8.130.22.3:8848}
        # 服务端开启鉴权时注入（与 discovery 同一约定）
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        # 本 Nacos 为多项目共享服务器——shop 项目独占 SHOP 组隔离，不碰 DEFAULT_GROUP 内他项目 dataId
        group: SHOP
        # 自动探测 dataId：shop-product.yml / shop-product-{profile}.yml（目前不建，缺省仅 WARN 忽略）
        file-extension: yml
        # Nacos 不可达时直接拒启：公共配置静默丢失比拒启更危险（mybatis-plus id-type 等）
        fail-fast: true
        # 公共配置（源文件 deploy/nacos/shop-common.yml，改动后跑 scripts/nacos-config-upload.sh 同步）
        shared-configs:
          - data-id: shop-common.yml
            group: SHOP
            refresh: true
      # discovery 注册也归「连 Nacos」层，从 application.yml 迁入（原 7 份重复，归口一处）
      # 本机差异（cluster-name 等）在 bootstrap-local.yml，profile 变体优先级高于本文件可覆盖
      discovery:
        server-addr: ${NACOS_ADDR:8.130.22.3:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  config:
    # spring-cloud-context 兜底：PropertySourceLocator 异常直接失败而非静默空配置
    fail-fast: true
