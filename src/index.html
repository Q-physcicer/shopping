<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{SLIDE_TITLE}}</title>
    <link rel="stylesheet" href="index.css" />
    <style>
      /* ─── 基础重置 ─── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: var(--font-body);
        background: var(--bg-primary, #ffffff);
      }

      /* ─── 演示视口：全屏容器，背景同主题色 ─── */
      .presentation-viewport {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: var(--bg-primary, #ffffff);
      }

      /* ─── 单页幻灯片 ─── */
      .slide {
        position: absolute !important;
        display: block !important;
        top: 0 !important;
        left: 0 !important;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        contain: layout style paint;
        opacity: 0 !important;
        pointer-events: none !important;
        transition: opacity 0.3s ease;
      }

      .slide.active {
        opacity: 1 !important;
        pointer-events: auto !important;
      }

      /* ─── 缩放容器：居中 + 等比缩放 ─── */
      .slide-scaler {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
        overflow: hidden;
      }

      /* ─── 右下角进度滑块 ─── */
      .progress-slider {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .progress-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #808080;
        cursor: pointer;
        transition:
          width 0.2s ease,
          background 0.2s ease,
          border-radius 0.2s ease;
      }

      .progress-dot:hover {
        background: #999;
      }

      .progress-dot.active {
        width: 16px;
        border-radius: 8px;
        background: #040927;
      }
    </style>
  </head>

  <body>
    <div class="presentation-viewport" id="viewport">
      <div class="slide-scaler" id="slideScaler">
        <!-- PAGES_HTML_REPLACE_POINT -->
      </div>
    </div>

    <div class="progress-slider" id="progressSlider"></div>

    <script>
      const SLIDES_COUNT =
        window.SLIDES_COUNT || document.querySelectorAll("#slideScaler > .slide").length || 0;
      const CANVAS_W = 1920;
      const CANVAS_H = 1080;

      // ─── 状态 ───
      let currentSlide = 0;

      // ─── DOM 引用 ───
      const viewport = document.getElementById("viewport");
      const scaler = document.getElementById("slideScaler");
      const progressSlider = document.getElementById("progressSlider");

      // ─── 初始化 ───
      function init() {
        showSlide(0);
        buildProgressSlider();
        scaleViewport();
        window.addEventListener("resize", scaleViewport);
      }

      // ─── 显示指定页 ───
      function showSlide(index) {
        if (index < 0 || index >= SLIDES_COUNT) return;
        currentSlide = index;
        const slides = scaler.querySelectorAll(".slide");
        slides.forEach((s, i) => s.classList.toggle("active", i === index));
        updateActiveDot(index);
      }

      // ─── 缩放视口适配 ───
      function scaleViewport() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const scale = Math.min(vw / CANVAS_W, vh / CANVAS_H);
        const offsetX = (vw - CANVAS_W * scale) / 2;
        const offsetY = (vh - CANVAS_H * scale) / 2;
        scaler.style.width = CANVAS_W + "px";
        scaler.style.height = CANVAS_H + "px";
        scaler.style.transform =
          "translate(" + offsetX + "px, " + offsetY + "px) scale(" + scale + ")";
      }

      // ─── 进度滑块 ───
      function buildProgressSlider() {
        progressSlider.innerHTML = "";
        for (let i = 0; i < SLIDES_COUNT; i++) {
          const dot = document.createElement("span");
          dot.className = "progress-dot" + (i === 0 ? " active" : "");
          dot.dataset.index = i;
          dot.addEventListener("click", () => showSlide(i));
          progressSlider.appendChild(dot);
        }
      }

      function updateActiveDot(index) {
        const dots = progressSlider.querySelectorAll(".progress-dot");
        dots.forEach((d, i) => d.classList.toggle("active", i === index));
      }

      // ─── 键盘快捷键 ───
      document.addEventListener("keydown", (e) => {
        switch (e.key) {
          case "ArrowRight":
          case "ArrowDown":
          case " ":
            e.preventDefault();
            showSlide(currentSlide + 1);
            break;
          case "ArrowLeft":
          case "ArrowUp":
            e.preventDefault();
            showSlide(currentSlide - 1);
            break;
          case "Home":
            e.preventDefault();
            showSlide(0);
            break;
          case "End":
            e.preventDefault();
            showSlide(SLIDES_COUNT - 1);
            break;
        }
      });

      // ─── 启动 ───
      init();
    </script>
  </body>
</html>
