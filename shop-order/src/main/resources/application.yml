server:
  port: 8104

# application.name/profiles 已迁 bootstrap.yml；mybatis-plus/redis/autoconfigure.exclude/jackson/rabbitmq 连接基座已上移 Nacos shop-common.yml（group SHOP）
# nacos.connection（config+discovery）归 bootstrap.yml，本机差异归 bootstrap-local.yml
spring:
  # datasource 不上 Nacos（本地 application-local.yml 用它覆盖连旧库 shopmanagement）
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual   # P2 秒杀消费幂等手动 ack（order 特有，不上移公共配置）

# 日志级别开关：env 可调（本机排障用 SHOP_LOG_LEVEL=debug 打印业务包与 MyBatis SQL）
logging:
  level:
    root: ${LOG_LEVEL:info}
    com.shop: ${SHOP_LOG_LEVEL:info}
