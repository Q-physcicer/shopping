server:
  port: 3000
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopmanagement
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    user:
      name: user
      password: pass
  autoconfigure:
    - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
    - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Redis 配置
redis:
  host: 127.0.0.1
  port: 6379
  database: 0
  password: 123456
  lettuce:
      pool:
        # 连接池中的最小空闲连接数
        min-idle: 0
        # 连接池中的最大空闲连接数
        max-idle: 8
        # 连接池的最大活跃连接数
        max-active: 8
        # 连接池最大阻塞等待时间，使用 PT 表示 Duration 格式
        max-wait: -1ms
jackson:
  date-format: yyyy-MM-dd HH:mm:ss

rabbitmq:
  host: localhost
  port: 15672   # 默认端口
  username: guest
  password: guest


mybatis-plus:
  mapper-locations: classpath:mapper/*.xml  # 如果需要自定义XML映射
  global-config:
    db-config:
      id-type: auto  # 主键类型
      field-strategy: not_null  # 字段策略
      table-underline: true  # 表名下划线
      logic-delete-field: deleted  # 逻辑删除字段名
      logic-not-delete-value: 0  # 逻辑未删除值
      logic-delete-value: 1  # 逻辑已删除值
  configuration:
    map-underscore-to-camel-case: true  # 驼峰命名转换
    cache-enabled: false  # 缓存配置

