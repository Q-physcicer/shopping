# ============================================================
# 本地敏感配置模板（此模板入库，填好后的真实文件不入库）
#
# 使用步骤：
#   1. 复制本文件为同目录下的 application-local.yml
#      cp application-local.template.yml application-local.yml
#   2. 把下方占位符替换为你的真实值
#   3. 直接启动即可（spring.profiles.active=local 自动加载 application-local.yml）
#
# 支持的环境变量（优先级高于本文件）：
#   DB_PASSWORD     数据库密码
#   DEEPSEEK_API_KEY  云端模型 API Key
#   SPRING_PROFILES_ACTIVE  激活的 profile（默认 local）
# ============================================================

spring:
  datasource:
    password: 你的MySQL密码

  ai:
    openai:
      api-key: 你的DeepSeek_API_Key