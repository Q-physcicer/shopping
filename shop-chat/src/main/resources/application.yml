server:
  port: 8106

# application.name/profiles 已迁 bootstrap.yml；redis/jackson 已上移 Nacos shop-common.yml（group SHOP）
spring:
  mvc:
    async:
      # 本地显式保留（Nacos shop-common.yml 有同值 180000 双保险）：
      # SSE 是 chat 命脉，若 Nacos 分发链路异常，本地兜底防止回退容器默认 30s 导致流中断
      request-timeout: 180000
  # nacos.connection（config+discovery）归 bootstrap.yml，本机差异归 bootstrap-local.yml
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:demo}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2048
    # MCP Server（P4）：工具由 MCP starter 自动暴露为 MCP tools
    mcp:
      server:
        name: shop-mcp-server
        version: 1.0.0
        # webmvc 版默认 SSE 端点：GET /sse（消息端点 /mcp/message）；8106 直连，不经网关
        type: SYNC
        capabilities:
          tool: true

# 日志级别开关：env 可调（本机排障用 SHOP_LOG_LEVEL=debug 打印业务包与 MyBatis SQL）
logging:
  level:
    root: ${LOG_LEVEL:info}
    com.shop: ${SHOP_LOG_LEVEL:info}
