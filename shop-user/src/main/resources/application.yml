server:
  port: 8101

# application.name/profiles 已迁 bootstrap.yml；mybatis-plus/redis/autoconfigure.exclude/jackson 已上移 Nacos shop-common.yml（group SHOP）
# nacos.connection（config+discovery）归 bootstrap.yml，本机差异归 bootstrap-local.yml
spring:
  # datasource 不上 Nacos（本地 application-local.yml 用它覆盖连旧库 shopmanagement）
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}   # 真实密码放 application-local.yml 或环境变量
    driver-class-name: com.mysql.cj.jdbc.Driver

# JWT（P1 鉴权改造使用）
shop:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-in-prod-0123456789abcdef}
    expire-days: 7

# 日志级别开关：env 可调（本机排障用 SHOP_LOG_LEVEL=debug 打印业务包与 MyBatis SQL）
logging:
  level:
    root: ${LOG_LEVEL:info}
    com.shop: ${SHOP_LOG_LEVEL:info}
